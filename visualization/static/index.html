<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение отчётов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Сравнение двух отчётов</h1>
    <p class="hint">Перетащите CSV в обе зоны и нажмите «Сравнить».</p>
  </header>

  <section class="drops">
    <div class="drop" id="dropA" data-slot="a">
      <input type="file" id="fileA" accept=".csv" hidden>
      <div class="drop__label">Отчёт A</div>
      <div class="drop__filename" id="nameA">Перетащите файл или кликните</div>
    </div>
    <div class="drop" id="dropB" data-slot="b">
      <input type="file" id="fileB" accept=".csv" hidden>
      <div class="drop__label">Отчёт B</div>
      <div class="drop__filename" id="nameB">Перетащите файл или кликните</div>
    </div>
  </section>

  <section class="actions">
    <button id="compareBtn" disabled>Сравнить</button>
    <span id="status" class="status"></span>
  </section>

  <section id="result" class="result hidden">
    <div id="summary" class="summary"></div>
    <div id="diffBlocks"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
